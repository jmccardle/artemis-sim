{% extends "base.html" %}

{% block title %}Dev Login — Artemis{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="card shadow-sm" style="max-width: 480px; width: 100%;">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <i class="bi bi-rocket-takeoff display-4 text-primary"></i>
                <h3 class="mt-2">Artemis Mission Simulation</h3>
                <span class="badge bg-warning text-dark">Development Mode</span>
            </div>

            <form method="POST" action="/dev/login">
                <div class="mb-3">
                    <label for="role" class="form-label fw-semibold">Select Role</label>
                    <div class="list-group">
                        {% for role in roles %}
                        <label class="list-group-item list-group-item-action d-flex align-items-center gap-2">
                            <input class="form-check-input flex-shrink-0" type="radio"
                                   name="role" value="{{ role }}"
                                   {% if role == 'admin' %}checked{% endif %}>
                            <span class="badge bg-role-{{ role | replace('-', '_') }}">
                                {{ role_display_names.get(role, role) }}
                            </span>
                            <small class="text-muted ms-auto">{{ role }}</small>
                        </label>
                        {% endfor %}
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 btn-lg">
                    <i class="bi bi-box-arrow-in-right"></i> Login
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
