{% extends "base.html" %}

{% block title %}Login — Artemis{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="card shadow-sm" style="max-width: 400px; width: 100%;">
        <div class="card-body text-center p-5">
            <i class="bi bi-rocket-takeoff display-3 text-primary mb-3"></i>
            <h3 class="card-title mb-3">Artemis Mission Simulation</h3>
            <p class="text-muted mb-4">Sign in to access the mission dashboard</p>
            <a href="/login" class="btn btn-primary btn-lg w-100">
                <i class="bi bi-box-arrow-in-right"></i> Sign In with Keycloak
            </a>
        </div>
    </div>
</div>
{% endblock %}
