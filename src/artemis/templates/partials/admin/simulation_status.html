<div class="row g-3 mb-4">
    <div class="col-sm-6 col-md-3">
        <div class="card stat-card shadow-sm">
            <div class="card-body text-center">
                <div class="stat-value text-primary">{{ status.mission_count }}</div>
                <div class="stat-label">Missions</div>
            </div>
        </div>
    </div>
    <div class="col-sm-6 col-md-3">
        <div class="card stat-card shadow-sm">
            <div class="card-body text-center">
                <div class="stat-value text-info">{{ status.task_count }}</div>
                <div class="stat-label">Tasks</div>
            </div>
        </div>
    </div>
    <div class="col-sm-6 col-md-3">
        <div class="card stat-card shadow-sm">
            <div class="card-body text-center">
                <div class="stat-value text-success">{{ status.contractor_count }}</div>
                <div class="stat-label">Contractors</div>
            </div>
        </div>
    </div>
    <div class="col-sm-6 col-md-3">
        <div class="card stat-card shadow-sm">
            <div class="card-body text-center">
                <div class="stat-value text-warning">{{ status.facility_count }}</div>
                <div class="stat-label">Facilities</div>
            </div>
        </div>
    </div>
</div>
