<div class="modal fade" id="reset-modal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title">
                    <i class="bi bi-exclamation-triangle"></i> Confirm Reset
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>This will <strong>permanently delete</strong> all missions, tasks, and artifacts.</p>
                <p>Contractors and facilities will be re-seeded to their default state.</p>
                <p class="text-danger fw-bold">This action cannot be undone.</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-danger"
                        hx-post="/views/admin/reset"
                        hx-target="#admin-status"
                        hx-swap="innerHTML"
                        data-bs-dismiss="modal">
                    <i class="bi bi-arrow-counterclockwise"></i> Reset Simulation
                </button>
            </div>
        </div>
    </div>
</div>
