{% if contracts %}
<div class="table-responsive">
    <table class="table table-sm table-hover">
        <thead>
            <tr>
                <th>Mission</th>
                <th>Component</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            {% for contract in contracts %}
            <tr>
                <td class="fw-semibold">{{ contract.mission_name }}</td>
                <td>{{ contract.component }}</td>
                <td><span class="badge bg-success">Awarded</span></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% else %}
<div class="text-center text-muted py-4">
    <i class="bi bi-file-earmark-check fs-1 d-block mb-2"></i>
    <p>No contracts awarded yet.</p>
</div>
{% endif %}
