<div class="card mb-3">
    <div class="card-body">
        <div class="d-flex justify-content-between align-items-start">
            <div>
                <h5 class="card-title mb-1">{{ mission.name }}</h5>
                <span class="badge bg-secondary">{{ mission.architecture_type }}</span>
                <span class="badge bg-mission-{{ mission.status }}">{{ mission.status }}</span>
            </div>
            <small class="text-muted">{{ mission.created_at.strftime('%Y-%m-%d') }}</small>
        </div>
        {% if mission.workflow_id %}
        <small class="text-muted d-block mt-2">
            <i class="bi bi-diagram-3"></i> {{ mission.workflow_id }}
        </small>
        {% endif %}
    </div>
</div>
