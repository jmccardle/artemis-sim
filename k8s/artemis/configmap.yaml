# Adjust hostnames and LLM endpoint for your environment.
# *.local hostnames require /etc/hosts entries (see docs/DEPLOYMENT.md).
apiVersion: v1
kind: ConfigMap
metadata:
  name: artemis-config
  namespace: artemis
data:
  # Database — password injected from Secret, not here
  ARTEMIS_DB_HOST: "postgres"
  ARTEMIS_DB_PORT: "5432"
  ARTEMIS_DB_USER: "artemis"
  ARTEMIS_DB_NAME: "artemis"
  ARTEMIS_TEMPORAL_HOST: "temporal-server:7233"
  ARTEMIS_TEMPORAL_NAMESPACE: "default"
  ARTEMIS_TEMPORAL_ORCHESTRATION_QUEUE: "artemis-orchestration"
  ARTEMIS_TEMPORAL_LLM_QUEUE: "artemis-llm"
  ARTEMIS_KEYCLOAK_URL: "http://keycloak.local"
  ARTEMIS_KEYCLOAK_REALM: "artemis-sim"
  ARTEMIS_KEYCLOAK_CLIENT_ID: "artemis-app"
  ARTEMIS_AUTH_DISABLED: "false"
  ARTEMIS_LLM_PROVIDER: "local"
  ARTEMIS_LLM_MODEL: "glm-4-32b"                       # adjust to your model
  ARTEMIS_LLM_BASE_URL: "http://YOUR_NODE_IP:8100/v1"  # LLM inference server
  ARTEMIS_BASE_URL: "http://artemis.local"
  ARTEMIS_CORS_ORIGINS: "http://keycloak.local,http://temporal.local"
  ARTEMIS_DEBUG: "false"
