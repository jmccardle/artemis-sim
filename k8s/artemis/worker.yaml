        - name: llm-worker
          image: artemis-sim:latest
          imagePullPolicy: Never
          command: ["python", "-m", "artemis.workers.llm_worker"]
          envFrom:
            - configMapRef:
                name: artemis-config
          env:
            - name: ARTEMIS_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: artemis-secrets
                  key: session-secret
            - name: ARTEMIS_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: artemis-secrets
                  key: llm-api-key
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
