apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: artemis
  namespace: artemis
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: artemis.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: artemis-app
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: temporal-ui
  namespace: artemis
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: temporal.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: temporal-ui
                port:
                  number: 80
