# DEV DEFAULTS — replace before any real deployment.
# Generate secrets with: openssl rand -hex 32
apiVersion: v1
kind: Secret
metadata:
  name: artemis-secrets
  namespace: artemis
type: Opaque
stringData:
  db-password: artemis              # must match postgres.yaml
  session-secret: change-me         # random string for session signing
  llm-api-key: not-needed           # set if using OpenAI/Anthropic
