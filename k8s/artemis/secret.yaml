# DEV DEFAULTS — for real deployments, create via kubectl instead:
#   kubectl -n artemis create secret generic artemis-secrets \
#     --from-literal=db-password="$(openssl rand -base64 32)" \
#     --from-literal=session-secret="$(openssl rand -hex 32)" \
#     --from-literal=llm-api-key="not-needed"
# db-password is used by both postgres.yaml (POSTGRES_PASSWORD) and app containers
# (ARTEMIS_DB_PASSWORD) — they must match.
apiVersion: v1
kind: Secret
metadata:
  name: artemis-secrets
  namespace: artemis
type: Opaque
stringData:
  db-password: artemis
  session-secret: change-me
  llm-api-key: not-needed
