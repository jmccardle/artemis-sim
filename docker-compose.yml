# Local development stack. All credentials below are dev defaults.
services:
  # Application PostgreSQL (mission data, artifacts, user state)
  postgresql:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: artemis
      POSTGRES_PASSWORD: artemis
      POSTGRES_DB: artemis
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artemis"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - artemis-network

  # Temporal PostgreSQL (Temporal internal state — separate instance)
  temporal-postgresql:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - artemis-network

  # Temporal Server
  temporal:
    image: temporalio/auto-setup:latest
    ports:
      - "7233:7233"
    depends_on:
      temporal-postgresql:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    volumes:
      - ./docker/dynamicconfig:/etc/temporal/config/dynamicconfig
    networks:
      - artemis-network

  # Temporal Web UI
  temporal-ui:
    image: temporalio/ui:latest
    ports:
      - "8081:8080"
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8000
    networks:
      - artemis-network

  # Keycloak (dev instance — pre-seeded realm for local development)
  # In production/K3s, an external Keycloak instance is used instead.
  # See docs/KEYCLOAK.md for dev vs production differences.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    ports:
      - "8180:8080"
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./docker/keycloak/realm-export.json:/opt/keycloak/data/import/artemis-sim-realm.json
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - artemis-network

  # ── Application services ─────────────────────────────────

  app:
    build: .
    ports:
      - "8001:8000"
    environment:
      ARTEMIS_DATABASE_URL: postgresql+asyncpg://artemis:artemis@postgresql:5432/artemis
      ARTEMIS_TEMPORAL_HOST: temporal:7233
      ARTEMIS_AUTH_DISABLED: "true"
      ARTEMIS_KEYCLOAK_URL: http://keycloak:8080
      ARTEMIS_BASE_URL: http://localhost:8000
      ARTEMIS_CORS_ORIGINS: http://localhost:5173
      ARTEMIS_DEBUG: "true"
    depends_on:
      postgresql:
        condition: service_healthy
      temporal:
        condition: service_started
    networks:
      - artemis-network
    command: >
      sh -c "alembic upgrade head &&
             uvicorn artemis.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic

  worker:
    build: .
    environment:
      ARTEMIS_DATABASE_URL: postgresql+asyncpg://artemis:artemis@postgresql:5432/artemis
      ARTEMIS_TEMPORAL_HOST: temporal:7233
      ARTEMIS_AUTH_DISABLED: "true"
      ARTEMIS_DEBUG: "true"
    depends_on:
      postgresql:
        condition: service_healthy
      temporal:
        condition: service_started
    networks:
      - artemis-network
    command: ["python", "-m", "artemis.workers.main"]
    volumes:
      - ./src:/app/src

  frontend:
    image: node:22-slim
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    environment:
      API_PROXY_TARGET: http://app:8000
    depends_on:
      - app
    networks:
      - artemis-network

volumes:
  postgres-data:
  temporal-postgres-data:
  frontend-node-modules:

networks:
  artemis-network:
    driver: bridge
