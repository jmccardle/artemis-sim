[project]
name = "artemis-sim"
version = "0.1.0"
description = "Artemis Mission Architecture Simulation — Temporal workflows + LLM automation"
requires-python = ">=3.11"
dependencies = [
    # Temporal
    "temporalio>=1.23.0",
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    # Templates
    "jinja2>=3.1.4",
    # HTTP client
    "httpx>=0.27.0",
    # Data validation / settings
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    # Auth (JWT / OIDC)
    "PyJWT[crypto]>=2.10.0",
    # LLM providers
    "openai>=1.55.0",
    "anthropic>=0.39.0",
    # SSE for real-time updates
    "sse-starlette>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
